<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATTICE — Cultural Infrastructure Protocol</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@400;300&family=Jost:wght@300;400&display=swap');
        body {
            font-family: 'Jost', system-ui, sans-serif;
            background: #1a1e24;
            color: #e8e4dc;
            margin: 0;
            padding: 0;
            line-height: 1.7;
        }
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(ellipse 80% 60% at 50% 20%, rgba(120,155,175,0.12) 0%, transparent 70%), #1a1e24;
        }
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(80px, 12vw, 140px);
            letter-spacing: 0.35em;
            color: #e8e4dc;
            margin-bottom: 24px;
        }
        .tagline {
            font-size: clamp(15px, 2vw, 18px);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #9aa8b2;
            margin-bottom: 40px;
        }
        .subtitle {
            max-width: 620px;
            font-size: 18px;
            color: #c8d4dc;
            margin-bottom: 60px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 18px 52px;
            border: 1px solid #b8a882;
            color: #e8e4dc;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }
        .btn:hover {
            background: #b8a882;
            color: #1a1e24;
        }
        footer {
            padding: 40px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">LATTICE</div>
        <div class="tagline">Cultural Infrastructure Protocol</div>
        <p class="subtitle">Belief before certainty.<br>A new architecture for the relationship between artists and those who believe in them.</p>
        <a href="/whitepaper/lattice-whitepaper.html" class="btn">Read the Whitepaper →</a>
    </div>

    <footer>
        Version 1.0 • <a href="https://github.com/Mjmames/lattice-protocol" style="color: #9aa8b2;">GitHub Repository</a>
    </footer>
</body>
</html>
